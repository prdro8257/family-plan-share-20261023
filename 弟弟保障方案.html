const storageKey='family-share-'+P.salt;
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const expired=()=>Date.now()>=P.expires;
document.getElementById('until').textContent=new Date(P.expires).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'（北京时间）';
async function unlock(raw){if(expired())throw Error('expired');const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(P.iv)},key,bytes(P.data));if(expired())throw Error('expired');sessionStorage.setItem(storageKey,btoa(String.fromCharCode(...new Uint8Array(raw))));document.open();document.write(new TextDecoder().decode(out));document.close();}
function error(e){document.getElementById('message').textContent=e.message==='expired'?'此分享链接已到期。':'密码不正确，请重新输入。';document.getElementById('enter').disabled=expired();}
if(expired()){sessionStorage.removeItem(storageKey);error(Error('expired'));}else{const cached=sessionStorage.getItem(storageKey);if(cached)window.addEventListener('DOMContentLoaded',()=>unlock(bytes(cached)).catch(()=>sessionStorage.removeItem(storageKey)),{once:true});}
document.getElementById('access').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('enter');btn.disabled=true;btn.textContent='正在打开…';try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveBits']);const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes(P.salt),iterations:600000,hash:'SHA-256'},material,256);await unlock(raw);}catch(e){error(e);btn.disabled=expired();btn.textContent='进入方案';}});
